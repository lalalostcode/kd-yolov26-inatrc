[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "inatrc-kd"
version = "0.1.0"
description = "Reproducible InaTRC YOLO26 knowledge distillation research and Stage B pilots"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "ultralytics==8.4.155",
  "wandb==0.28.1",
  "torch>=2.4,<2.14",
  "torchvision>=0.19,<0.29",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pillow>=10",
  "pyyaml>=6.0",
  "packaging>=24,<27",
]

[project.scripts]
inatrc-kd = "inatrc_kd.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "nbformat>=5.10,<6"]

[tool.hatch.build.targets.wheel]
packages = ["src/inatrc_kd"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv]
# Local lock is CPU-only. Kaggle explicitly inherits its compatible CUDA pair.
constraint-dependencies = ["torch==2.10.0", "torchvision==0.25.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "smoke: small end-to-end synthetic training and checkpoint regression",
  "gpu: CUDA and AMP checks (requires a usable CUDA device)",
]
